name: Sync RH Drive

# CDMX sin DST desde 2022 (UTC-6 year-round).
# Diario 12:00 PM CDMX = 18:00 UTC.
# Soft-check: inventario hr_* en Supabase + actualiza hr_drive_sync_state.
# Full Drive→DB (File Stream / carpetas nuevas) sigue siendo opcional en PC admin
# o vía POST /api/hr/sync con sesión RH. Ver ingestor/CLOUD_SYNC.md § RH.

on:
  schedule:
    # Diario 12:00 PM CDMX (= 18:00 UTC)
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: sync-hr-drive
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestor/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check required secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=0
          check() {
            name="$1"
            val="$2"
            if [ -z "$val" ]; then
              echo "::error::Falta secret Actions: $name (Settings → Secrets and variables → Actions)"
              missing=1
            else
              echo "OK secret $name (len=${#val})"
            fi
          }
          check NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
          check SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          exit $missing

      - name: Soft-sync RH inventory → hr_drive_sync_state
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CI: "true"
          PYTHONUTF8: "1"
        run: python sync_hr_drive_cloud.py
