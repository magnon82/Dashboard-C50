name: Sync Gmail diario

# 5:00 AM hora Ciudad de México ≈ 11:00 UTC (CST) / 10:00 UTC (CDT)
# Infocaja (ventas) + CORTE (cancelaciones/descuentos/cortesías) → Supabase
# Dashboard: Ventas

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: sync-gmail-diario
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestor/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Sync Infocaja + CORTE
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          CI: "true"
          PYTHONUTF8: "1"
        # Facturas CFDI se sincronizan en local (adjuntos a disco); no romper Infocaja en CI.
        run: python sync_gmail_diario.py --newer-than 7 --skip-facturas
