name: Sync Gmail diario

# CDMX sin DST desde 2022 (UTC-6).
# Lun–sáb ~5:17 AM CDMX = 11:17 UTC (días 1–6).
# Domingo 8:00 PM CDMX = lunes 02:00 UTC (cron weekday 1).
# Minutos fuera de :00 en la mañana para reducir drops del scheduler de GitHub.
# Infocaja (ventas) + CORTE (cancelaciones/descuentos/cortesías) → Supabase
# Dashboard: Ventas

on:
  schedule:
    # Lun–sáb ~5:17 AM CDMX
    - cron: "17 11 * * 1-6"
    # Lun–sáb respaldo ~6:47 AM CDMX
    - cron: "47 12 * * 1-6"
    # Domingo 8:00 PM CDMX (lunes 02:00 UTC)
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-gmail-diario
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestor/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check required secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          missing=0
          check() {
            name="$1"
            val="$2"
            if [ -z "$val" ]; then
              echo "::error::Falta secret Actions: $name (Settings → Secrets and variables → Actions)"
              missing=1
            else
              echo "OK secret $name (len=${#val})"
            fi
          }
          check NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
          check SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          check GOOGLE_OAUTH_CLIENT_JSON "$GOOGLE_OAUTH_CLIENT_JSON"
          check GOOGLE_OAUTH_TOKEN_JSON "$GOOGLE_OAUTH_TOKEN_JSON"
          exit $missing

      - name: Sync Infocaja + CORTE
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          CI: "true"
          PYTHONUTF8: "1"
        # Facturas CFDI se sincronizan en local (adjuntos a disco); no romper Infocaja en CI.
        run: python sync_gmail_diario.py --newer-than 7 --skip-facturas
