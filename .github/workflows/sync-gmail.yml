name: Sync Gmail diario

# CDMX sin DST desde 2022 (UTC-6).
# GitHub cron es best-effort (puede retrasarse minutos/horas). Por eso:
#   · cron cada 3 h UTC (cobertura continua)
#   · anclas L–S madrugada + Dom noche
# Infocaja (ventas) + CORTE → Supabase; CFDI → financial_records (best-effort).
# Dashboard: Ventas · Socios · Finanzas/Facturas
# Certeza: Actions → Notify me (fallos) + alerta en hub si Infocaja atrasada.

on:
  schedule:
    # Cada 3 h UTC (~cada 3 h CDMX). Minuto :05 para evitar colisión con otros workflows.
    - cron: "5 */3 * * *"
    # Lun–sáb 4:00 AM CDMX
    - cron: "0 10 * * 1-6"
    # Lun–sáb respaldo ~5:17 AM CDMX
    - cron: "17 11 * * 1-6"
    # Domingo 8:00 / 8:15 / 8:30 / 9:00 PM CDMX (lunes 02:00–03:00 UTC)
    - cron: "0 2 * * 1"
    - cron: "15 2 * * 1"
    - cron: "30 2 * * 1"
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-gmail-diario
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Infocaja+CORTE + ventana CFDI; CFDI es paso aparte (no tumba ventas).
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestor/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check required secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          missing=0
          check() {
            name="$1"
            val="$2"
            if [ -z "$val" ]; then
              echo "::error::Falta secret Actions: $name (Settings → Secrets and variables → Actions)"
              missing=1
            else
              echo "OK secret $name (len=${#val})"
            fi
          }
          check NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
          check SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          check GOOGLE_OAUTH_CLIENT_JSON "$GOOGLE_OAUTH_CLIENT_JSON"
          check GOOGLE_OAUTH_TOKEN_JSON "$GOOGLE_OAUTH_TOKEN_JSON"
          exit $missing

      - name: Sync Infocaja + CORTE
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          CI: "true"
          PYTHONUTF8: "1"
        # Ventas primero; CFDI va en el paso siguiente (best-effort).
        run: python sync_gmail_diario.py --newer-than 7 --skip-facturas

      - name: Sync Facturas CFDI → Supabase
        # Best-effort: no tumbar Infocaja/CORTE si Gmail/adjuntos fallan.
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          CI: "true"
          PYTHONUTF8: "1"
          # En CI sin I: los adjuntos van a ingestor/data/facturas; el índice sí a ERP (financial_records).
          FACTURAS_PATH: ${{ github.workspace }}/ingestor/data/facturas
        run: python ingest_facturas_gmail.py --newer-than 7

      - name: Mark job failed clearly
        if: failure()
        run: |
          echo "::error::Sync Gmail falló. Revisa el paso en rojo y secrets Actions. Activa notificaciones: GitHub → Settings → Notifications → Actions."
          exit 1
