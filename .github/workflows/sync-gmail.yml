name: Sync Gmail diario

# CDMX sin DST desde 2022 (UTC-6).
# Objetivo: automático, sin depender de “Run workflow”.
#   · Lun–Sáb 2:00–6:00 AM CDMX cada hora   → 8:00–12:00 UTC
#   · Lun–Sáb 8,10,12,14 CDMX (refuerzo)    → 14,16,18,20 UTC
#       (el Fin de Día suele llegar después de la madrugada)
#   · Dom 7:00–11:00 PM CDMX cada hora      → lun 1:00–5:00 UTC
# GitHub cron puede retrasarse; los refuerzos diurnos cubren el hueco.
# Tras las 10:00 CDMX, si falta el día esperado el job FALLA (no verde falso).

on:
  schedule:
    # Lun–Sáb madrugada 2–6 AM CDMX
    - cron: "0 8-12 * * 1-6"
    # Lun–Sáb refuerzo 8,10,12,14 CDMX
    - cron: "0 14,16,18,20 * * 1-6"
    # Dom 7–11 PM CDMX (= lun 1–5 UTC)
    - cron: "0 1-5 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-gmail-diario
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestor/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check required secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          missing=0
          check() {
            name="$1"
            val="$2"
            if [ -z "$val" ]; then
              echo "::error::Falta secret Actions: $name (Settings → Secrets and variables → Actions)"
              missing=1
            else
              echo "OK secret $name (len=${#val})"
            fi
          }
          check NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
          check SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          check GOOGLE_OAUTH_CLIENT_JSON "$GOOGLE_OAUTH_CLIENT_JSON"
          check GOOGLE_OAUTH_TOKEN_JSON "$GOOGLE_OAUTH_TOKEN_JSON"
          exit $missing

      - name: Sync Infocaja + CORTE
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          CI: "true"
          PYTHONUTF8: "1"
        run: python sync_gmail_diario.py --newer-than 7 --skip-facturas

      - name: Verify Infocaja al día (auto)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CI: "true"
          PYTHONUTF8: "1"
        run: python verify_infocaja_freshness.py

      - name: Sync Facturas CFDI → Supabase
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          CI: "true"
          PYTHONUTF8: "1"
          FACTURAS_PATH: ${{ github.workspace }}/ingestor/data/facturas
        run: python ingest_facturas_gmail.py --newer-than 7

      - name: Mark job failed clearly
        if: failure()
        run: |
          echo "::error::Sync Gmail falló o Infocaja sigue atrasada tras el horario automático. Revisa el paso en rojo; el próximo refuerzo del cron volverá a intentar."
          exit 1
