name: Sync Calidad encuestas

# CDMX sin DST desde 2022 (UTC-6 year-round).
# Diario 4:00 AM CDMX = 10:00 UTC.
# Solo agrega filas nuevas de la hoja Encuestas (source_hash) al archivo
# calidad-encuestas/encuestas.json. No reescribe historial.

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: sync-calidad-encuestas
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestor/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check required secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          missing=0
          check() {
            name="$1"
            val="$2"
            if [ -z "$val" ]; then
              echo "::error::Falta secret Actions: $name"
              missing=1
            else
              echo "OK secret $name (len=${#val})"
            fi
          }
          check NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
          check SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          check GOOGLE_OAUTH_CLIENT_JSON "$GOOGLE_OAUTH_CLIENT_JSON"
          check GOOGLE_OAUTH_TOKEN_JSON "$GOOGLE_OAUTH_TOKEN_JSON"
          exit $missing

      - name: Sync hoja Encuestas → calidad_encuestas
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          CI: "true"
          PYTHONUTF8: "1"
        run: python sync_calidad_encuestas.py
