name: Sync Finanzas Drive/Sheets

# CDMX = UTC-6 year-round.
# Fuentes cloud: CxP histórico, presupuesto Excel, estados Excel, ventas_semana.
# Dashboard Master → Fuentes de origen · última sync

on:
  schedule:
    # 6:37 AM y 6:37 PM CDMX (= 12:37 y 00:37 UTC)
    - cron: "37 12 * * *"
    - cron: "37 0 * * *"
  workflow_dispatch:

concurrency:
  group: sync-finanzas-cloud
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestor/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check required secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          missing=0
          check() {
            name="$1"
            val="$2"
            if [ -z "$val" ]; then
              echo "::error::Falta secret Actions: $name"
              missing=1
            else
              echo "OK secret $name (len=${#val})"
            fi
          }
          check NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
          check SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          check GOOGLE_OAUTH_CLIENT_JSON "$GOOGLE_OAUTH_CLIENT_JSON"
          check GOOGLE_OAUTH_TOKEN_JSON "$GOOGLE_OAUTH_TOKEN_JSON"
          exit $missing

      - name: Sync CxP + presupuesto + estados + ventas_semana
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          CI: "true"
        run: python sync_finanzas_cloud.py
